<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enigma Digital · Convite</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#14182b;--mut:#5b6280;--ac:#5b3df5;--ok:#0f9d6b;--bad:#d6334d;--bd:#d9dcea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1a;--card:#141935;--tx:#e8ecff;--mut:#97a0c8;--ac:#7cf2c9;--ok:#7cf2c9;--bad:#ff6b8a;--bd:#2a3163}}
:root[data-theme="dark"]{--bg:#0b0e1a;--card:#141935;--tx:#e8ecff;--mut:#97a0c8;--ac:#7cf2c9;--ok:#7cf2c9;--bad:#ff6b8a;--bd:#2a3163}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:520px}
h1{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;margin:8px 0 4px;letter-spacing:.5px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:6px;margin-bottom:16px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--bd)}
.bar i.on{background:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.tag{font-family:ui-monospace,Menlo,monospace;color:var(--ac);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.q{font-size:1.15rem;margin:8px 0 14px;line-height:1.4}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.6rem;letter-spacing:4px;color:var(--ac);margin:6px 0 14px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:1rem}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font-weight:700;font-size:1rem;cursor:pointer}
.msg{min-height:1.4em;margin-top:10px;font-size:.95rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.hint{color:var(--mut);font-size:.85rem;margin-top:6px}
.frag{display:flex;gap:8px;justify-content:center;margin:14px 0;font-family:ui-monospace,Menlo,monospace}
.frag span{padding:8px 12px;border:1px dashed var(--bd);border-radius:8px;color:var(--mut)}
.frag span.on{border-style:solid;border-color:var(--ac);color:var(--ac)}
.final{text-align:center}
.final h2{font-size:1.5rem;margin:6px 0}
.big{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;color:var(--ac);margin:12px 0}
</style>
</head>
<body>
<main>
<h1>&gt; ENIGMA_DIGITAL</h1>
<p class="sub">Tens um convite secreto à espera. Resolve os 4 desafios para o desbloquear.</p>
<div class="bar" id="bar"><i></i><i></i><i></i><i></i></div>
<div class="frag" id="frag"><span>15</span><span>dez</span><span>10h</span></div>
<div class="card" id="card"></div>
</main>
<script>
var L=[
{t:"Desafio 1 · Cifra",q:"Mensagem intercetada. Cada letra avançou uma posição no alfabeto. Decifra-a:",c:"FOJHNB",h:"Recua uma letra: F→E…",a:["enigma"],f:"15"},
{t:"Desafio 2 · Sequência",q:"Qual é o próximo número? 2 · 4 · 8 · 16 · ?",a:["32"],h:"Cada número é o dobro do anterior.",f:"dez"},
{t:"Desafio 3 · Charada",q:"O que é que tem teclas mas não abre nenhuma porta?",a:["teclado","piano"],h:"Está mesmo à tua frente… ou num palco.",f:"10h"},
{t:"Desafio 4 · Binário",q:"Último guardião! Que número é 1010 em binário?",a:["10","dez"],h:"8 + 0 + 2 + 0",f:""}
];
var n=0,card=document.getElementById("card");
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function draw(){
 var bars=document.querySelectorAll("#bar i"),fr=document.querySelectorAll("#frag span");
 for(var i=0;i<4;i++)bars[i].className=i<n?"on":"";
 for(var j=0;j<3;j++)fr[j].className=j<n?"on":"";
 if(n>=4){final();return}
 var d=L[n];
 card.innerHTML='<div class="tag">'+d.t+'</div><div class="q">'+d.q+'</div>'+(d.c?'<div class="code">'+d.c+'</div>':'')+
 '<input id="r" autocomplete="off" placeholder="A tua resposta…"><button id="b">Verificar</button><div class="msg" id="m"></div><div class="hint">Pista: '+d.h+'</div>';
 var r=document.getElementById("r");
 r.addEventListener("keydown",function(e){if(e.key==="Enter")chk()});
 document.getElementById("b").onclick=chk;
}
function chk(){
 var v=norm(document.getElementById("r").value),m=document.getElementById("m");
 if(L[n].a.indexOf(v)>-1){m.className="msg ok";m.textContent="✔ Correto! Fragmento desbloqueado.";setTimeout(function(){n++;draw()},700)}
 else{m.className="msg bad";m.textContent="✖ Ainda não. Tenta outra vez!"}
}
function final(){
 document.querySelectorAll("#bar i").forEach(function(b){b.className="on"});
 document.querySelectorAll("#frag span").forEach(function(b){b.className="on"});
 card.className="card final";
 card.innerHTML='<div class="tag">Meta alcançada 🏁</div><h2>Estás convidado(a)!</h2>'+
 '<p>Estás convidado(a) a participar no</p><div class="big">ENIGMA DIGITAL</div>'+
 '<p><strong>15 de dezembro, às 10h00</strong></p><p class="hint">Não faltes. Traz curiosidade e vontade de resolver enigmas!</p>';
}
draw();
</script>
</body>
</html>
